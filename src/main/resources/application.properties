spring.application.name=Hacka
server.port=8089
spring.datasource.url=jdbc:mysql://localhost:3306/hacka?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
# Import d'annonces par IA (UC-04), version gratuite de l'API Gemini.
hacka.llm.api-key=${LLM_API_KEY:}
hacka.llm.model=openai/gpt-oss-120b
hacka.llm.url=https://api.groq.com/openai/v1


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration