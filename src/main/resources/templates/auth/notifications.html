<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-4" style="max-width:800px">
    <h2 class="mb-3">Mes notifications</h2>
    <div class="alert alert-secondary" th:if="${#lists.isEmpty(notifications)}">Aucune notification.</div>
    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-start"
            th:each="n : ${notifications}" th:classappend="${!n.read} ? 'list-group-item-warning'">
            <div>
                <span class="badge bg-primary me-2" th:if="${!n.read}">Nouveau</span>
                <span th:text="${n.message}">message</span>
            </div>
            <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">date</small>
        </li>
    </ul>
</div>
</body>
</html>
