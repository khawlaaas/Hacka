<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calendrier des hackathons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div th:replace="~{fragments/catalog :: nav}"></div>
<div th:replace="~{participation/fragments :: flash}"></div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Calendrier des hackathons</h2>
    <a class="btn btn-outline-secondary" th:href="@{/hackathons/calendar.ics}">📅 Tout exporter (.ics)</a>
</div>

<p class="alert alert-info" th:if="${months.isEmpty()}">Aucun hackathon à venir.</p>

<div class="mb-4" th:each="entry : ${months}">
    <h4 class="text-capitalize border-bottom pb-1" th:text="${entry.key}"></h4>
    <div class="list-group">
        <div class="list-group-item d-flex justify-content-between align-items-center" th:each="h : ${entry.value}">
            <div>
                <div class="fw-bold">
                    <a th:href="@{/hackathons/{id}(id=${h.id})}" th:text="${h.title}" class="text-decoration-none"></a>
                    <span class="badge" th:classappend="'text-bg-' + ${h.status.badge}" th:text="${h.status.label}"></span>
                </div>
                <small class="text-muted">
                    <span th:text="${#temporals.format(h.startDate, 'dd/MM HH:mm')}"></span> →
                    <span th:text="${#temporals.format(h.endDate, 'dd/MM HH:mm')}"></span>
                    · <span th:text="${h.mode.label}"></span>
                    <span th:if="${h.location != null}" th:text="'· ' + ${h.location.city}"></span>
                </small>
            </div>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/hackathons/{id}/calendar.ics(id=${h.id})}">.ics</a>
        </div>
    </div>
</div>

</body>
</html>
