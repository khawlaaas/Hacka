<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogue des hackathons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div th:replace="~{fragments/catalog :: nav}"></div>
<div th:replace="~{participation/fragments :: flash}"></div>

<h2 class="mb-3">Catalogue des hackathons</h2>

<form th:action="@{/hackathons}" th:object="${filter}" method="get" class="card card-body mb-4">
    <div class="row g-2">
        <div class="col-md-4">
            <label class="form-label small mb-0">Mot-clé</label>
            <input type="text" th:field="*{keyword}" class="form-control" placeholder="Titre ou description">
        </div>
        <div class="col-md-2">
            <label class="form-label small mb-0">Ville</label>
            <input type="text" th:field="*{city}" class="form-control">
        </div>
        <div class="col-md-2">
            <label class="form-label small mb-0">Mode</label>
            <select th:field="*{mode}" class="form-select">
                <option value="">Tous</option>
                <option th:each="m : ${modes}" th:value="${m}" th:text="${m.label}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label small mb-0">Thème</label>
            <select th:field="*{themeId}" class="form-select">
                <option value="">Tous</option>
                <option th:each="t : ${themes}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label small mb-0">Statut</label>
            <select th:field="*{status}" class="form-select">
                <option value="">À venir et en cours</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small mb-0">Début à partir du</label>
            <input type="date" th:field="*{from}" class="form-control">
        </div>
        <div class="col-md-3">
            <label class="form-label small mb-0">Début jusqu'au</label>
            <input type="date" th:field="*{to}" class="form-control">
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check">
                <input type="checkbox" th:field="*{onlyAvailable}" class="form-check-input">
                <label class="form-check-label" th:for="${#ids.prev('onlyAvailable')}">Places disponibles</label>
            </div>
        </div>
        <div class="col-md-3 d-flex align-items-end gap-2">
            <button class="btn btn-primary">Filtrer</button>
            <a th:href="@{/hackathons}" class="btn btn-outline-secondary">Réinitialiser</a>
        </div>
    </div>
</form>

<p class="text-muted"><span th:text="${page.totalElements}">0</span> résultat(s)</p>
<p class="alert alert-info" th:if="${page.isEmpty()}">Aucun hackathon ne correspond à votre recherche.</p>

<div class="row g-3 mb-4">
    <div class="col-md-4" th:each="h : ${page.content}">
        <div th:replace="~{fragments/catalog :: card(${h})}"></div>
    </div>
</div>

<nav th:if="${page.totalPages > 1}">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/hackathons(page=${page.number - 1}, keyword=${filter.keyword}, city=${filter.city}, mode=${filter.mode}, themeId=${filter.themeId}, status=${filter.status}, from=${filter.from}, to=${filter.to}, onlyAvailable=${filter.onlyAvailable})}">«</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:text="${i + 1}"
               th:href="@{/hackathons(page=${i}, keyword=${filter.keyword}, city=${filter.city}, mode=${filter.mode}, themeId=${filter.themeId}, status=${filter.status}, from=${filter.from}, to=${filter.to}, onlyAvailable=${filter.onlyAvailable})}"></a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/hackathons(page=${page.number + 1}, keyword=${filter.keyword}, city=${filter.city}, mode=${filter.mode}, themeId=${filter.themeId}, status=${filter.status}, from=${filter.from}, to=${filter.to}, onlyAvailable=${filter.onlyAvailable})}">»</a>
        </li>
    </ul>
</nav>

</body>
</html>
