<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Équipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
<h2>Équipes : <span th:text="${hackathon.title}"></span></h2>
<div th:replace="~{participation/fragments :: flash}"></div>

<a th:if="${myTeam == null}" class="btn btn-primary mb-3"
   th:href="@{/hackathons/{id}/teams/new(id=${hackathon.id})}">Créer mon équipe</a>

<div class="row">
    <div class="col-md-7">
        <h4>Équipes</h4>
        <p th:if="${teams.isEmpty()}" class="text-muted">Aucune équipe pour le moment.</p>
        <div class="card mb-3" th:each="t : ${teams}">
            <div class="card-body">
                <h5 th:text="${t.name}"></h5>
                <p th:text="${t.description}"></p>
                <p class="small">Recherche : <b th:text="${t.lookingForSkills}"></b> ·
                    <span th:text="${t.members.size()} + '/' + ${t.maxSize} + ' membres'"></span></p>
                <ul class="small">
                    <li th:each="m : ${t.members}"
                        th:text="${m.user.firstName} + ' ' + ${m.user.lastName} + ' (' + ${m.role} + ')'"></li>
                </ul>
                <form th:if="${myTeam == null and !t.full}" th:action="@{/teams/{id}/apply(id=${t.id})}" method="post"
                      class="d-flex gap-2">
                    <input name="message" class="form-control" placeholder="Un petit mot (optionnel)">
                    <button class="btn btn-sm btn-success">Postuler</button>
                </form>
                <form th:if="${myTeam != null and myTeam.id == t.id}" th:action="@{/teams/{id}/leave(id=${t.id})}"
                      method="post"><button class="btn btn-sm btn-outline-danger">Quitter l'équipe</button></form>
            </div>
        </div>
    </div>

    <div class="col-md-5">
        <h4>Team Finder <small class="text-muted">(participants sans équipe)</small></h4>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="u : ${finder}">
                <span th:text="${u.firstName} + ' ' + ${u.lastName}"></span>
                <form th:if="${amLeader}" th:action="@{/teams/{id}/invite(id=${myTeam.id})}" method="post">
                    <input type="hidden" name="userId" th:value="${u.id}">
                    <button class="btn btn-sm btn-outline-primary">Inviter</button>
                </form>
            </li>
        </ul>
    </div>
</div>
</body></html>
