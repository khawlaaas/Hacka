<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mes badges</title>
</head>
<body class="container py-4">
<h2>Mes badges</h2>
<div th:replace="~{participation/fragments :: flash}"></div>
<p th:if="${badges.isEmpty()}" class="text-muted">
    Aucun badge pour le moment. Inscrivez-vous à un hackathon pour débloquer le premier !</p>
<div class="row">
    <div class="col-md-4 mb-3" th:each="ub : ${badges}">
        <div class="card text-center h-100">
            <div class="card-body">
                <div style="font-size:2.5rem" th:text="${ub.badge.icon}"></div>
                <h5 th:text="${ub.badge.name}"></h5>
                <p class="small text-muted" th:text="${ub.badge.description}"></p>
                <small th:text="'Obtenu le ' + ${#temporals.format(ub.awardedAt, 'dd/MM/yyyy')}"></small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
