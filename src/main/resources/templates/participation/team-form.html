<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Créer une équipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4" style="max-width:600px">
<h2>Créer une équipe</h2>
<form th:action="@{/hackathons/{id}/teams(id=${hackathon.id})}" th:object="${teamForm}" method="post">
    <div class="mb-3"><label class="form-label">Nom *</label>
        <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{name}"></div></div>
    <div class="mb-3"><label class="form-label">Description</label>
        <textarea class="form-control" th:field="*{description}"></textarea></div>
    <div class="mb-3"><label class="form-label">Profils recherchés (ex : Design, IA)</label>
        <input class="form-control" th:field="*{lookingForSkills}"></div>
    <div class="mb-3"><label class="form-label">Nombre de places</label>
        <input type="number" class="form-control" th:field="*{maxSize}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{maxSize}"></div></div>
    <button class="btn btn-primary">Créer</button>
</form>
</body></html>
