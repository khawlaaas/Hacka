<!DOCTYPE html>
<html lang="en">
<!-- admin/dashboard.html -->
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-4"><canvas id="roles"></canvas></div>
        <div class="col-md-4"><canvas id="status"></canvas></div>
        <div class="col-md-4"><canvas id="themes"></canvas></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const roles  = /*[[${usersByRole}]]*/ {};
    const status = /*[[${byStatus}]]*/ {};
    const themes = /*[[${byTheme}]]*/ {};
    const make = (id, type, label, data) => new Chart(document.getElementById(id), {
        type: type,
        data: { labels: Object.keys(data), datasets: [{ label: label, data: Object.values(data) }] }
    });
    make('roles', 'doughnut', 'Utilisateurs par rôle', roles);
    make('status', 'bar', 'Hackathons par statut', status);
    make('themes', 'bar', 'Hackathons par thème', themes);
</script>
</body>
</html>
