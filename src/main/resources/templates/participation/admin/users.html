<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Utilisateurs')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-4">
    <h2 class="mb-3">Utilisateurs</h2>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-striped align-middle">
        <thead>
        <tr><th>Nom</th><th>Email</th><th>Ville</th><th>Rôle</th><th>Compte</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.firstName + ' ' + u.lastName}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.city}"></td>
            <td>
                <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-1">
                    <select name="role" class="form-select form-select-sm">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                th:selected="${r == u.role}"></option>
                    </select>
                    <button class="btn btn-sm btn-outline-primary">OK</button>
                </form>
            </td>
            <td>
          <span class="badge" th:classappend="${u.enabled} ? 'bg-success' : 'bg-secondary'"
                th:text="${u.enabled} ? 'Actif' : 'Bloqué'"></span>
            </td>
            <td>
                <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                    <button class="btn btn-sm"
                            th:classappend="${u.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                            th:text="${u.enabled} ? 'Bloquer' : 'Débloquer'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
