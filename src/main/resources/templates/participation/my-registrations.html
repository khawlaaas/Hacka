<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mes hackathons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
<h2>Mes inscriptions</h2>
<div th:replace="~{participation/fragments :: flash}"></div>
<p th:if="${registrations.isEmpty()}" class="text-muted">Vous n'êtes inscrit à aucun hackathon.</p>
<table class="table" th:unless="${registrations.isEmpty()}">
    <thead><tr><th>Hackathon</th><th>Date d'inscription</th><th>Statut</th><th></th></tr></thead>
    <tbody>
    <tr th:each="r : ${registrations}">
        <td><a th:href="@{/hackathons/{id}(id=${r.hackathon.id})}" th:text="${r.hackathon.title}"></a></td>
        <td th:text="${#temporals.format(r.registrationDate, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${r.status}"></td>
        <td><a th:if="${r.status.name() == 'CONFIRMED'}" class="btn btn-sm btn-outline-primary"
               th:href="@{/hackathons/{id}/teams(id=${r.hackathon.id})}">Équipes</a></td>
    </tr>
    </tbody>
</table>
</body></html>
