<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recommandations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<h2>Hackathons Recommandés pour Vous</h2>

<!-- Inclusion du fragment pour les messages de succès/erreur -->
<div th:replace="~{participation/fragments :: flash}"></div>

<!-- Si la liste de recommandations est vide -->
<p th:if="${items.isEmpty()}" class="text-muted">Aucune recommandation disponible pour le moment. Pensez à mettre à jour vos compétences !</p>

<!-- Liste des hackathons recommandés avec le score de correspondance -->
<div th:unless="${items.isEmpty()}">
    <div class="card mb-2" th:each="i : ${items}">
        <div class="card-body d-flex justify-content-between align-items-center">
            <a th:href="@{/hackathons/{id}(id=${i.hackathon.id})}" th:text="${i.hackathon.title}" class="fw-bold text-decoration-none"></a>
            <span class="badge bg-success" th:text="${#numbers.formatPercent(i.score, 1, 0)} + ' de correspondance'"></span>
        </div>
    </div>
</div>

</body>
</html>
