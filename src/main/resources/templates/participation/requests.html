<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mes demandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
<div th:replace="~{participation/fragments :: flash}"></div>
<h4>Invitations reçues</h4>
<p th:if="${invitations.isEmpty()}" class="text-muted">Aucune invitation.</p>
<div class="card mb-2" th:each="r : ${invitations}"><div class="card-body d-flex justify-content-between">
    <span>Équipe <b th:text="${r.team.name}"></b> (<span th:text="${r.team.hackathon.title}"></span>)</span>
    <span class="d-flex gap-2">
      <form th:action="@{/requests/{id}/accept(id=${r.id})}" method="post"><button class="btn btn-sm btn-success">Accepter</button></form>
      <form th:action="@{/requests/{id}/reject(id=${r.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Refuser</button></form>
    </span></div></div>

<h4 class="mt-4">Candidatures à mon équipe</h4>
<p th:if="${applications.isEmpty()}" class="text-muted">Aucune candidature.</p>
<div class="card mb-2" th:each="r : ${applications}"><div class="card-body d-flex justify-content-between">
    <span><b th:text="${r.user.firstName} + ' ' + ${r.user.lastName}"></b> veut rejoindre <i th:text="${r.team.name}"></i>
      <small class="text-muted" th:if="${r.message}" th:text="'« ' + ${r.message} + ' »'"></small></span>
    <span class="d-flex gap-2">
      <form th:action="@{/requests/{id}/accept(id=${r.id})}" method="post"><button class="btn btn-sm btn-success">Accepter</button></form>
      <form th:action="@{/requests/{id}/reject(id=${r.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Refuser</button></form>
    </span></div></div>
</body></html>
