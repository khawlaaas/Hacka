<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prix et sponsors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div th:replace="~{fragments/catalog :: nav}"></div>
<div th:replace="~{participation/fragments :: flash}"></div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Prix et sponsors <small class="text-muted fs-6" th:text="${hackathon.title}"></small></h2>
    <a class="btn btn-outline-secondary" th:href="@{/organizer/hackathons}">Retour</a>
</div>

<div class="row g-4">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Prix</h5>
                <p class="text-muted" th:if="${hackathon.prizes.isEmpty()}">Aucun prix.</p>
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="p : ${hackathon.prizes}">
                        <span>
                            <strong th:text="${p.title}"></strong>
                            <span th:if="${p.amount != null}" th:text="'- ' + ${#numbers.formatDecimal(p.amount, 1, 'WHITESPACE', 0, 'POINT')} + ' MAD'"></span>
                            <small class="text-muted d-block" th:if="${p.description != null}" th:text="${p.description}"></small>
                        </span>
                        <form th:action="@{/organizer/hackathons/{id}/prizes/{pid}/delete(id=${hackathon.id}, pid=${p.id})}" method="post" class="m-0">
                            <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                        </form>
                    </li>
                </ul>
                <form th:action="@{/organizer/hackathons/{id}/prizes(id=${hackathon.id})}" th:object="${prizeForm}" method="post">
                    <div class="row g-2">
                        <div class="col-md-5"><input type="text" th:field="*{title}" class="form-control" placeholder="Titre (1er prix...)" required></div>
                        <div class="col-md-4"><input type="number" step="0.01" min="0" th:field="*{amount}" class="form-control" placeholder="Montant (MAD)"></div>
                        <div class="col-md-3 d-grid"><button class="btn btn-primary">Ajouter</button></div>
                        <div class="col-12"><input type="text" th:field="*{description}" class="form-control" placeholder="Description (facultatif)"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Sponsors</h5>
                <p class="text-muted" th:if="${hackathon.sponsors.isEmpty()}">Aucun sponsor.</p>
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="s : ${hackathon.sponsors}">
                        <span th:text="${s.name}"></span>
                        <form th:action="@{/organizer/hackathons/{id}/sponsors/{sid}/remove(id=${hackathon.id}, sid=${s.id})}" method="post" class="m-0">
                            <button class="btn btn-sm btn-outline-danger">Retirer</button>
                        </form>
                    </li>
                </ul>

                <form th:action="@{/organizer/hackathons/{id}/sponsors/add(id=${hackathon.id})}" method="post" class="mb-3">
                    <label class="form-label small mb-0">Ajouter un sponsor existant</label>
                    <div class="input-group">
                        <select name="sponsorId" class="form-select" required>
                            <option value="">Choisir...</option>
                            <option th:each="s : ${allSponsors}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                        <button class="btn btn-outline-primary">Ajouter</button>
                    </div>
                </form>

                <form th:action="@{/organizer/hackathons/{id}/sponsors/new(id=${hackathon.id})}" th:object="${sponsorForm}" method="post">
                    <label class="form-label small mb-0">Ou créer un nouveau sponsor</label>
                    <div class="row g-2">
                        <div class="col-md-6"><input type="text" th:field="*{name}" class="form-control" placeholder="Nom" required></div>
                        <div class="col-md-6"><input type="text" th:field="*{website}" class="form-control" placeholder="https://..."></div>
                        <div class="col-12 d-grid"><button class="btn btn-primary">Créer et ajouter</button></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
