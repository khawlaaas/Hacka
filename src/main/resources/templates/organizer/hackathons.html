<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes hackathons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div th:replace="~{fragments/catalog :: nav}"></div>
<div th:replace="~{participation/fragments :: flash}"></div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Mes hackathons</h2>
    <div class="d-flex gap-2">
        <a th:href="@{/organizer/organizations}" class="btn btn-outline-secondary">Mes organisations</a>
        <a th:href="@{/organizer/hackathons/new}" class="btn btn-primary">+ Publier un hackathon</a>
    </div>
</div>

<p class="alert alert-info" th:if="${hackathons.isEmpty()}">Vous n'avez publié aucun hackathon.</p>

<div class="table-responsive" th:unless="${hackathons.isEmpty()}">
    <table class="table align-middle">
        <thead>
        <tr><th>Titre</th><th>Dates</th><th>Statut</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="h : ${hackathons}">
            <td>
                <a th:href="@{/hackathons/{id}(id=${h.id})}" th:text="${h.title}" class="fw-bold text-decoration-none"></a>
                <div class="small text-muted" th:text="${h.organization.name}"></div>
            </td>
            <td class="small">
                <span th:text="${#temporals.format(h.startDate, 'dd/MM/yyyy')}"></span> →
                <span th:text="${#temporals.format(h.endDate, 'dd/MM/yyyy')}"></span>
            </td>
            <td><span class="badge" th:classappend="'text-bg-' + ${h.status.badge}" th:text="${h.status.label}"></span></td>
            <td class="text-end">
                <div class="d-inline-flex flex-wrap gap-1 justify-content-end">
                    <a class="btn btn-sm btn-outline-primary" th:if="${h.status.editable}"
                       th:href="@{/organizer/hackathons/{id}/edit(id=${h.id})}">Modifier</a>
                    <a class="btn btn-sm btn-outline-secondary" th:if="${h.status.editable}"
                       th:href="@{/organizer/hackathons/{id}/extras(id=${h.id})}">Prix et sponsors</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/organizer/hackathons/{id}/registrants(id=${h.id})}">Inscrits</a>
                    <form th:if="${h.status.cancellable}" th:action="@{/organizer/hackathons/{id}/cancel(id=${h.id})}"
                          method="post" class="m-0" onsubmit="return confirm('Annuler ce hackathon ?');">
                        <button class="btn btn-sm btn-outline-warning">Annuler</button>
                    </form>
                    <form th:if="${h.status.deletable}" th:action="@{/organizer/hackathons/{id}/delete(id=${h.id})}"
                          method="post" class="m-0" onsubmit="return confirm('Supprimer définitivement ?');">
                        <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
