<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Organisations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div th:replace="~{fragments/catalog :: nav}"></div>
<div th:replace="~{participation/fragments :: flash}"></div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Organisations</h2>
    <a class="btn btn-outline-secondary" th:href="@{/organizer/hackathons}">Mes hackathons</a>
</div>

<div class="row g-4">
    <div class="col-lg-7">
        <p class="text-muted" th:if="${organizations.isEmpty()}">Aucune organisation.</p>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="o : ${organizations}">
                <span>
                    <strong th:text="${o.name}"></strong>
                    <span class="badge text-bg-light border" th:text="${o.type.label}"></span>
                    <a th:if="${o.website != null}" th:href="${o.website}" th:text="${o.website}" class="small d-block" target="_blank" rel="noopener"></a>
                </span>
                <span class="d-flex gap-1">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/organizer/organizations/{id}/edit(id=${o.id})}">Modifier</a>
                    <form th:action="@{/organizer/organizations/{id}/delete(id=${o.id})}" method="post" class="m-0"
                          onsubmit="return confirm('Supprimer cette organisation ?');">
                        <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </span>
            </li>
        </ul>
    </div>

    <div class="col-lg-5">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${editId != null} ? 'Modifier l\'organisation' : 'Nouvelle organisation'"></h5>
                <form th:action="${editId != null} ? @{/organizer/organizations/{id}(id=${editId})} : @{/organizer/organizations}"
                      th:object="${form}" method="post" novalidate>
                    <div class="mb-2">
                        <label class="form-label">Nom *</label>
                        <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Type *</label>
                        <select th:field="*{type}" class="form-select" th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                            <option value="">Choisir...</option>
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{type}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Site web</label>
                        <input type="text" th:field="*{website}" class="form-control" placeholder="https://..." th:classappend="${#fields.hasErrors('website')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{website}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL du logo</label>
                        <input type="text" th:field="*{logoUrl}" class="form-control">
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" th:text="${editId != null} ? 'Enregistrer' : 'Créer'"></button>
                        <a th:if="${editId != null}" th:href="@{/organizer/organizations}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
