<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Importer une annonce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 860px">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{participation/fragments :: flash}"></div>

<h2 class="mb-2">Importer une annonce</h2>
<p class="text-muted">
    Collez le texte d'une annonce (post Instagram, message LinkedIn, e-mail...). L'IA pré-remplit le formulaire
    de publication ; vous vérifiez et corrigez avant de soumettre.
</p>

<form th:action="@{/organizer/import}" th:object="${importForm}" method="post" novalidate id="importForm">
    <div class="mb-3">
        <textarea th:field="*{text}" rows="12" class="form-control"
                  placeholder="Collez ici le texte de l'annonce..."
                  th:classappend="${#fields.hasErrors('text')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:errors="*{text}"></div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary" id="analyseBtn">Analyser avec l'IA</button>
        <a th:href="@{/organizer/hackathons/new}" class="btn btn-outline-secondary">Saisir manuellement</a>
        <a th:href="@{/organizer/hackathons}" class="btn btn-link">Retour</a>
    </div>
</form>

<script>
    // L'appel à l'IA peut durer quelques secondes : on évite le double envoi
    document.getElementById('importForm').addEventListener('submit', function () {
        var b = document.getElementById('analyseBtn');
        b.disabled = true;
        b.textContent = 'Analyse en cours...';
    });
</script>
</body>
</html>
