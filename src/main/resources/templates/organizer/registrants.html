<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscrits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div th:replace="~{fragments/catalog :: nav}"></div>
<div th:replace="~{participation/fragments :: flash}"></div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h2 class="mb-0">Inscrits</h2>
        <div class="text-muted">
            <span th:text="${hackathon.title}"></span> ·
            <span th:text="${confirmedCount}">0</span>
            <span th:if="${hackathon.maxParticipants != null}" th:text="'/ ' + ${hackathon.maxParticipants}"></span>
            inscription(s) confirmée(s)
        </div>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-success" th:href="@{/organizer/hackathons/{id}/registrants.csv(id=${hackathon.id})}">⬇ Exporter en CSV</a>
        <a class="btn btn-outline-secondary" th:href="@{/organizer/hackathons}">Retour</a>
    </div>
</div>

<p class="alert alert-info" th:if="${registrants.isEmpty()}">Aucune inscription pour le moment.</p>

<div class="table-responsive" th:unless="${registrants.isEmpty()}">
    <table class="table table-striped align-middle">
        <thead><tr><th>Nom</th><th>Email</th><th>Ville</th><th>Inscrit le</th><th>Statut</th></tr></thead>
        <tbody>
        <tr th:each="r : ${registrants}">
            <td th:text="${r.user.firstName + ' ' + r.user.lastName}"></td>
            <td th:text="${r.user.email}"></td>
            <td th:text="${r.user.city}"></td>
            <td th:text="${#temporals.format(r.registrationDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td><span class="badge text-bg-secondary" th:text="${r.status}"></span></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
