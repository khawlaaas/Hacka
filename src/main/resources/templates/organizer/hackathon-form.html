<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editId != null} ? 'Modifier le hackathon' : 'Publier un hackathon'">Hackathon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 860px">

<div th:replace="~{fragments/catalog :: nav}"></div>

<h2 class="mb-3" th:text="${editId != null} ? 'Modifier le hackathon' : 'Publier un hackathon'"></h2>
<p class="text-muted" th:if="${editId == null}">
    Votre hackathon sera créé au statut « Proposé » et visible dans le catalogue après validation par un administrateur.
</p>

<form th:action="${editId != null} ? @{/organizer/hackathons/{id}(id=${editId})} : @{/organizer/hackathons}"
      th:object="${form}" method="post" novalidate>

    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
        <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    </div>

    <div class="alert alert-warning" th:if="${duplicates != null}">
        <strong>Hackathons similaires :</strong>
        <ul class="mb-2">
            <li th:each="d : ${duplicates}">
                <a th:href="@{/hackathons/{id}(id=${d.id})}" th:text="${d.title}" target="_blank"></a>
                (<span th:text="${#temporals.format(d.startDate, 'dd/MM/yyyy')}"></span>)
            </li>
        </ul>
        <div class="form-check">
            <input type="checkbox" th:field="*{ignoreDuplicates}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('ignoreDuplicates')}">Ce n'est pas un doublon, publier quand même</label>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Titre *</label>
        <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{title}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea th:field="*{description}" rows="5" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:errors="*{description}"></div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">Début *</label>
            <input type="datetime-local" th:field="*{startDate}" class="form-control" th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{startDate}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Fin *</label>
            <input type="datetime-local" th:field="*{endDate}" class="form-control" th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{endDate}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Date limite d'inscription</label>
            <input type="datetime-local" th:field="*{registrationDeadline}" class="form-control" th:classappend="${#fields.hasErrors('registrationDeadline')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{registrationDeadline}"></div>
        </div>
        <div class="col-12 text-danger small" th:if="${#fields.hasErrors('datesConsistent')}" th:errors="*{datesConsistent}"></div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">Mode *</label>
            <select th:field="*{mode}" class="form-select" th:classappend="${#fields.hasErrors('mode')} ? 'is-invalid'">
                <option value="">Choisir...</option>
                <option th:each="m : ${modes}" th:value="${m}" th:text="${m.label}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{mode}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Nombre de places</label>
            <input type="number" min="1" th:field="*{maxParticipants}" class="form-control" placeholder="Illimité"
                   th:classappend="${#fields.hasErrors('maxParticipants')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{maxParticipants}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Lien officiel</label>
            <input type="text" th:field="*{externalLink}" class="form-control" placeholder="https://..."
                   th:classappend="${#fields.hasErrors('externalLink')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{externalLink}"></div>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-5">
            <label class="form-label">Ville (si présentiel ou hybride)</label>
            <input type="text" th:field="*{locationCity}" class="form-control">
        </div>
        <div class="col-md-7">
            <label class="form-label">Adresse</label>
            <input type="text" th:field="*{locationAddress}" class="form-control">
        </div>
        <div class="col-12 text-danger small" th:if="${#fields.hasErrors('locationConsistent')}" th:errors="*{locationConsistent}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Organisation *</label>
        <select th:field="*{organizationId}" class="form-select" th:classappend="${#fields.hasErrors('organizationId')} ? 'is-invalid'">
            <option value="">Choisir...</option>
            <option th:each="o : ${organizations}" th:value="${o.id}" th:text="${o.name}"></option>
        </select>
        <div class="invalid-feedback" th:errors="*{organizationId}"></div>
        <div class="form-text">Votre organisation n'est pas dans la liste ? <a th:href="@{/organizer/organizations}">Créez-la ici</a>.</div>
    </div>

    <div class="mb-4">
        <label class="form-label d-block">Thèmes *</label>
        <div class="form-check form-check-inline" th:each="t : ${themes}">
            <input type="checkbox" th:field="*{themeIds}" th:value="${t.id}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('themeIds')}" th:text="${t.name}"></label>
        </div>
        <div class="text-danger small" th:if="${#fields.hasErrors('themeIds')}" th:errors="*{themeIds}"></div>
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-primary" th:text="${editId != null} ? 'Enregistrer' : 'Soumettre pour validation'"></button>
        <a th:href="@{/organizer/hackathons}" class="btn btn-outline-secondary">Retour</a>
    </div>
</form>

</body>
</html>
