<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Navigation simple du module catalogue (A peut la remplacer par la barre de navigation globale) -->
<nav th:fragment="nav" class="d-flex flex-wrap gap-3 align-items-center border-bottom pb-2 mb-4">
    <a th:href="@{/}" class="fw-bold text-decoration-none fs-5">Hacka</a>
    <a th:href="@{/hackathons}" class="text-decoration-none">Catalogue</a>
    <a th:href="@{/hackathons/calendar}" class="text-decoration-none">Calendrier</a>
    <a th:href="@{/organizer/hackathons}" class="text-decoration-none">Espace organisateur</a>
</nav>

<!-- Carte d'un hackathon (liste et accueil) -->
<div th:fragment="card(h)" class="card h-100 shadow-sm">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center">
            <span class="badge" th:classappend="'text-bg-' + ${h.status.badge}" th:text="${h.status.label}"></span>
            <small class="text-muted" th:text="${h.mode.label}"></small>
        </div>
        <h5 class="card-title mt-2">
            <a th:href="@{/hackathons/{id}(id=${h.id})}" th:text="${h.title}" class="text-decoration-none stretched-link"></a>
        </h5>
        <p class="text-muted small mb-1" th:text="${h.organization.name}"></p>
        <p class="small mb-1">
            <span th:text="${#temporals.format(h.startDate, 'dd/MM/yyyy')}"></span>
            →
            <span th:text="${#temporals.format(h.endDate, 'dd/MM/yyyy')}"></span>
        </p>
        <p class="small mb-1" th:if="${h.location != null}" th:text="'📍 ' + ${h.location.city}"></p>
        <p class="small text-danger mb-1"
           th:if="${h.registrationDeadline != null and h.status.name() == 'REGISTRATION_OPEN'}"
           th:text="'⏳ Inscriptions jusqu\'au ' + ${#temporals.format(h.registrationDeadline, 'dd/MM/yyyy HH:mm')}"></p>
        <p class="small mb-1" th:if="${h.maxParticipants != null}" th:text="${h.maxParticipants} + ' places'"></p>
        <div class="mt-auto pt-2">
            <span class="badge text-bg-light border me-1" th:each="t : ${h.themes}" th:text="${t.name}"></span>
        </div>
    </div>
</div>

</body>
</html>
