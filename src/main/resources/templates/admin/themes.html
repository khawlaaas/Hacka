<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thèmes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-4" style="max-width:700px">
    <h2 class="mb-3">Thèmes</h2>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/admin/themes}" method="post" class="d-flex gap-2 mb-4">
        <input name="name" class="form-control" placeholder="Nouveau thème" required>
        <button class="btn btn-primary">Ajouter</button>
    </form>

    <table class="table table-striped">
        <thead><tr><th>#</th><th>Nom</th><th></th></tr></thead>
        <tbody>
        <tr th:each="t : ${themes}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.name}"></td>
            <td class="text-end">
                <form th:action="@{/admin/themes/{id}/delete(id=${t.id})}" method="post"
                      onsubmit="return confirm('Supprimer ce thème ?')">
                    <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
